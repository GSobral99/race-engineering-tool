name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    name: Backend (.NET build + tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend/RaceEngineeringApi
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build --no-restore --configuration Release

      - name: Test
        run: |
          if ls ../RaceEngineeringApi.Tests/*.csproj 1> /dev/null 2>&1; then
            dotnet test ../RaceEngineeringApi.Tests --no-restore --configuration Release
          else
            echo "No test project found yet — skipping."
          fi

  frontend:
    name: Frontend (TypeScript build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build